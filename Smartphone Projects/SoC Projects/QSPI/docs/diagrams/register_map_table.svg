  <rect fill="#fff" x="70" y="173" width="1140" height="67"/><rect fill="#f1f4f9" x="70" y="240" width="1140" height="67"/><rect fill="#fff" x="70" y="307" width="1140" height="67"/><rect fill="#f1f4f9" x="70" y="374" width="1140" height="67"/><rect fill="#fff" x="70" y="441" width="1140" height="67"/><rect fill="#f1f4f9" x="70" y="508" width="1140" height="67"/><rect fill="#fff" x="70" y="575" width="1140" height="67"/><rect fill="#f1f4f9" x="70" y="642" width="1140" height="67"/><rect fill="#fff" x="70" y="709" width="1140" height="67"/><rect fill="#f1f4f9" x="70" y="776" width="1140" height="69"/><rect fill="#fff" x="70" y="845" width="1140" height="67"/><rect fill="#f1f4f9" x="70" y="912" width="1140" height="67"/>
  <path class="line" d="M70 240H1210M70 307H1210M70 374H1210M70 441H1210M70 508H1210M70 575H1210M70 642H1210M70 709H1210M70 776H1210M70 845H1210M70 912H1210"/>

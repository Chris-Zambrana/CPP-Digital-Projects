<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1057" viewBox="0 0 1280 1057">
  <defs>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 34px Arial,Helvetica,sans-serif;fill:#162033}.subtitle{font:400 16px Arial,Helvetica,sans-serif;fill:#4f5b6f}
      .outline{fill:#fff;stroke:#c8d0df;stroke-width:2}.header{fill:#24324a}.header-text{font:700 16px Arial,Helvetica,sans-serif;fill:#fff}
      .line{stroke:#d7deea;stroke-width:1}.offset{font:700 17px Consolas,"Courier New",monospace;fill:#26364f}.access{font:700 15px Arial,Helvetica,sans-serif;fill:#31516f}.reg{font:700 17px Arial,Helvetica,sans-serif;fill:#18243a}
      .field{font:700 12px Consolas,"Courier New",monospace;fill:#162033}.field-sm{font:700 10px Consolas,"Courier New",monospace;fill:#162033}.field-xs{font:700 8px Consolas,"Courier New",monospace;fill:#162033}
      .rsv{fill:#e8edf5;stroke:#c8d0df}.ctl{fill:#d9ecff;stroke:#7bb7e6}.stat{fill:#dcf7e7;stroke:#7ac79a}.cmd{fill:#ffe9cf;stroke:#e3a357}.data{fill:#f0e3ff;stroke:#b38ae6}.timing{fill:#fff7c9;stroke:#d4bd48}.addr{fill:#dff6f8;stroke:#65bfc8}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1280" height="1057"/>
  <text class="title" x="70" y="62">QSPI Controller Register Map</text>
  <text class="subtitle" x="72" y="92">Word-addressable CSR map matching qspi_csr_map</text>
